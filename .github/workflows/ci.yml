name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint and code style (Ruff)
        run: |
          ruff check src tests scripts

      - name: Type checking (Mypy strict)
        run: |
          mypy --strict src

      - name: Validate documentation structure and local links
        run: python scripts/validate_project_docs.py

      - name: Security audit (Bandit SAST)
        run: |
          bandit -r src -ll -ii

      - name: Verify Codebase Integrity
        run: |
          python scripts/audit_codebase_integrity.py

      - name: Verify REST API Contract
        run: |
          python .agents/skills/api-design-testing/scripts/validate_api_contract.py

      - name: Verify Async Concurrency
        run: |
          python .agents/skills/async-concurrency-engineering/scripts/audit_async_concurrency.py

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and QA dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium for isolated browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run maintained tests and coverage
        run: python -m pytest tests --junitxml=tests/artifacts/junit.xml --cov-report=xml:tests/artifacts/coverage.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python-version }}
          path: tests/artifacts/
