name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint and code style (Ruff)
        run: |
          ruff check .

      - name: Type checking (Mypy strict)
        run: |
          mypy --strict src

      - name: Security audit (Bandit SAST)
        run: |
          bandit -r src -ll -ii

      - name: Verify Codebase Integrity
        run: |
          python scripts/audit_codebase_integrity.py

      - name: Verify REST API Contract
        run: |
          python .agents/skills/api-design-testing/scripts/validate_api_contract.py

      - name: Verify Async Concurrency
        run: |
          python .agents/skills/async-concurrency-engineering/scripts/audit_async_concurrency.py
