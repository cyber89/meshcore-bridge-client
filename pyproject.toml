[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-bridge"
version = "3.0.0"
description = "Deterministic and Resilient Async USB/Serial to MQTT Bridge for MeshCore LoRa Network with n8n Integration"
authors = [{ name = "MeshCore Dev Team" }]
requires-python = ">=3.14.8"
dependencies = [
    "paho-mqtt==2.1.0",
    "meshcore==2.3.15",
    "pyserial==3.5",
    "python-dotenv==1.2.4",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "websockets==17.2",
    "starlette==1.7.0",
    "h11==0.16.0",
]

[project.optional-dependencies]
# Retain the web extra for existing installation commands; ASGI is production.
web = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "websockets==17.2",
    "starlette==1.7.0",
    "h11==0.16.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.4.0",
    "ruff==0.17.0",
    "bandit==1.9.4",
    "playwright==1.63.0",
    "httpx==0.28.1",
    "cryptography==50.0.2",
]

[tool.setuptools]
py-modules = ["config", "meshcore_bridge", "runtime_requirements", "run_interactive_demo"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.setuptools.package-data]
"src.web" = ["static/**/*", "docs_ui/**/*", "templates/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "artifacts", "__pycache__"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
show_error_codes = true
exclude = [
    "reference/",
    "scratch/",
]

[[tool.mypy.overrides]]
module = [
    "paho.*",
    "serial.*",
    "meshcore.*",
    "dotenv.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
    "reference",
    "tests/artifacts",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line length handled by formatter
    "B008", # Do not perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
# Fail clearly on an unsupported runtime before Python 3.14.8 PEP 562 lazy exports execute.
"src/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.xenon]
max_absolute = "B"
max_modules = "A"
max_average = "A"
exclude = ["reference/*", "tests/*", "scratch/*"]

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Clean Architecture: Dominio aislado de Infraestructura Web y MQTT"
type = "forbidden"
source_modules = [
    "src.protocol_types",
    "src.lqi_engine",
    "src.sensor_decoder",
    "src.deduplicator",
]
forbidden_modules = [
    "src.web",
    "src.mqtt_client",
    "src.serial_driver",
]

